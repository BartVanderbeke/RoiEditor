name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke test imports
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          import cv2
          from PyQt6 import QtCore
          import RoiEditor.__main__

          print("opencv", cv2.__version__)
          print("qt", QtCore.QT_VERSION_STR)

          if sys.platform.startswith("linux"):
            os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
            from PyQt6.QtWidgets import QApplication
            app = QApplication([])
            print("linux_qapplication_ok")
            app.quit()

          print("smoke_ok")
          PY
